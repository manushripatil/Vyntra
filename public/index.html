<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vyntra ZK Proof</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .card {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
      width: 420px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      width: 95%;
      padding: 10px;
      background: #4f9cff;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggles {
      text-align: left;
      margin: 10px 0;
      font-size: 14px;
      color: #ccc;
    }

    .result {
      margin-top: 15px;
      background: #111;
      padding: 10px;
      border-radius: 8px;
      text-align: left;
      white-space: pre-wrap;
    }

    label {
      display: block;
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <h1>Vyntra Zero-Knowledge Age Proof</h1>

  <div class="card">

    <input id="ageInput" type="number" placeholder="Enter age" />

    <div class="toggles">
      <label><input type="checkbox" id="toggleProof"> Show ZK Proof</label>
      <label><input type="checkbox" id="toggleSignals"> Show Public Signals</label>
      <label><input type="checkbox" id="toggleExplain" checked> Privacy Explanation</label>
    </div>

    <button id="verifyBtn">Generate Proof</button>

    <div id="result" class="result"></div>

  </div>

  <script src="app.js"></script>

</body>
</html>
