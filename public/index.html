<!DOCTYPE html>
<html>
<head>
  <title>Vyntra</title>
  <style>
    body {
      background: #0a0a0a;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 320px;
      padding: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      background: #4f9cff;
      border: none;
      color: white;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      white-space: pre-line;
    }

    .toggles {
      margin-top: 10px;
      text-align: left;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Vyntra</h2>

  <input id="ageInput" type="number" placeholder="Enter age">

  <div class="toggles">
    <label><input type="checkbox" id="toggleDataFlow"> Data Flow View</label><br>
    <label><input type="checkbox" id="toggleSteps"> Proof Steps</label>
  </div>

  <button onclick="verifyAge()">Generate Proof</button>

  <div class="result" id="result"></div>
</div>

<script src="app.js"></script>

</body>
</html>
