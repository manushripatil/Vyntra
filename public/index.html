<!DOCTYPE html>
<html>
<head>
  <title>Vyntra</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>Vyntra</header>

<section class="hero">

  <div class="left">
    <h1>Verify age without exposing identity</h1>
    <p>Zero-knowledge proof system for privacy-first verification.</p>
  </div>

  <div class="card">

    <input id="age" type="number" placeholder="Enter age" />
    <button onclick="verifyAge()">Generate Proof</button>

    <div class="result" id="result"></div>

    <!-- ZK VISUAL SYSTEM -->
    <div class="zk-panel">

      <div class="zk-title">ZK Proof Pipeline</div>

      <div id="flow">
        <div class="step">Waiting for input...</div>
      </div>

      <div class="network">
        📡 Network Payload
        <pre id="payload">{}</pre>
      </div>

    </div>

    <!-- TOGGLES -->
    <div class="toggle-box">

      <div class="toggle">
        Data Flow View
        <label class="switch">
          <input type="checkbox" id="toggleData">
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle">
        Proof Visualization
        <label class="switch">
          <input type="checkbox" id="toggleProof">
          <span class="slider"></span>
        </label>
      </div>

    </div>

  </div>
</section>

<script src="app.js"></script>

</body>
</html>
