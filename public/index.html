<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vyntra Age Proof</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }

    button:hover {
      background: #4338ca;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
    }

    .card {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Vyntra Age Proof</h1>

    <input id="ageInput" type="number" placeholder="Enter your age" />

    <br />

    <button id="verifyBtn" onclick="verifyAge()">
      Verify
    </button>

    <p id="result">Waiting...</p>
  </div>

  <script src="app.js"></script>

</body>
</html>
